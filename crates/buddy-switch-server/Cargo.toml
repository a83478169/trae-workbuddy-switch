[package]
name = "buddy-switch-server"
version = "2026.9.301656"
edition = "2021"
description = "buddy-switch HTTP server + CLI（npm 安装形态：buddy-switch 命令启动本地 webui）"

# lib + bin：`lib` 供桌面端（`src-tauri`）复用同一份 webui 服务
# （`api::router()` 与两个网关宿主都是框架无关的），`bin` 仍是 `buddy-switch` CLI。
[lib]
name = "buddy_switch_server"
path = "src/lib.rs"

[[bin]]
name = "buddy-switch"
path = "src/main.rs"

[dependencies]
buddy-switch-core = { path = "../buddy-switch-core" }
buddy-switch-gateway = { path = "../buddy-switch-gateway" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json = "1"
rust-embed = "8"

[dev-dependencies]
# `tower` 已在 Cargo.lock（axum 0.7 的传递依赖），仅用于路由级测试的 `oneshot` 驱动。
tower = { version = "0.5", features = ["util"] }
# 认证中间件的测试要自己拼 `Authorization: Basic <base64>`。
base64 = "0.22"
# `rusqlite` 已在依赖树中（buddy-switch-core 以同版本同 feature 使用），零网络。
# 仅用于路由级测试构造 `workbuddy.db` 夹具。
rusqlite = { version = "0.32", features = ["bundled"] }
