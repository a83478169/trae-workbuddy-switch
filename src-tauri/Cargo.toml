[package]
name = "buddy-switch-rust"
version = "2026.9.301656"
description = "BuddySwitch —— WorkBuddy 账号切换工具（Rust/Tauri 版）"
authors = ["NextAgentX"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "buddy_switch_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 默认启用 custom-protocol：不开该 feature 的 `cargo build --release` 会产出加载
# devUrl http://localhost:1420 的开发模式 exe，vite 未运行时窗口即报
# “localhost 拒绝连接”。`tauri dev` 传 --no-default-features 并过滤本 feature，
# `tauri build` 显式传 tauri/custom-protocol，两者均不受影响。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
buddy-switch-core = { path = "../crates/buddy-switch-core" }
buddy-switch-gateway = { path = "../crates/buddy-switch-gateway" }
# 桌面端内置 webui：直接复用 server crate 的同一份 axum 路由（前端产物 + 业务全同），
# 于是「桌面窗口」和「浏览器」两条入口操作的是同一份数据。
buddy-switch-server = { path = "../crates/buddy-switch-server" }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# `net` 供内置 webui 的 `TcpListener` 绑定端口；`rt-multi-thread` 由 Tauri 运行时提供。
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2.7.2"

# 系统自启（开机静默启动）：仅桌面目标支持（macOS / Windows / Linux）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString"] }
